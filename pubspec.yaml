name: famnest
description: "FamNest - private, offline family chat over home Wi-Fi. Messages, photos and files stay on your family's devices."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Local storage (everything stays on the device)
  sqlite3: ^3.5.2
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Security
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # Local networking & discovery
  nsd: ^5.0.1
  network_info_plus: ^8.2.2

  # Media & files
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  open_filex: ^5.0.0
  mime: ^2.1.0

  # Background & notifications
  flutter_local_notifications: ^22.3.2
  flutter_foreground_task: ^11.0.3

  uuid: ^4.6.0
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_flavorizr: ^2.4.1
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
    - assets/branding/splash_logo.png
